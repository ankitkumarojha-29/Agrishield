<script>
        document.addEventListener('DOMContentLoaded', () => {
            const options = document.querySelectorAll('.lang-option');
            const btn = document.getElementById('continue-btn');
            const btnText = btn.querySelector('span');

            const continueTexts = {
                'hi': 'आगे बढ़ें',
                'en': 'Continue',
                'mr': 'पुढे जा',
                'te': 'కొనసాగించు',
                'ta': 'தொடரவும்'
            };

            options.forEach(opt => {
                opt.addEventListener('click', () => {
                    // Remove selected state from all
                    options.forEach(o => {
                        o.classList.remove('selected');
                        const bg = o.querySelector('.absolute.inset-0.bg-primary\\/5');
                        if(bg && !o.classList.contains('selected')) bg.className = 'absolute inset-0 bg-primary/0 group-[.selected]:bg-primary/5 transition-colors';
                        const check = o.querySelector('.absolute.right-3, .absolute.right-4');
                        if(check && !o.classList.contains('selected')) check.classList.replace('opacity-100', 'opacity-0');
                    });
                    
                    // Add to clicked
                    opt.classList.add('selected');
                    const bg = opt.querySelector('.absolute.inset-0');
                    if(bg) bg.className = 'absolute inset-0 bg-primary/5 transition-colors';
                    const check = opt.querySelector('.absolute.right-3, .absolute.right-4');
                    if(check) check.classList.replace('opacity-0', 'opacity-100');

                    // Update button text
                    const lang = opt.dataset.lang;
                    if(continueTexts[lang]) {
                        btnText.textContent = continueTexts[lang];
                    }
                    
                    // Add subtle scale bump to button
                    btn.style.transform = 'scale(1.02)';
                    setTimeout(() => btn.style.transform = 'scale(1)', 150);
                });
            });
        });
    </script>
