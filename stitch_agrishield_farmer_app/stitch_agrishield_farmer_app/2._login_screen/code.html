<input class="w-full h-14 bg-surface-container-lowest rounded-lg text-center font-headline-lg-mobile text-headline-lg-mobile text-on-surface shadow-[0_2px_8px_rgba(0,0,0,0.04)] focus:shadow-[0_4px_12px_rgba(27,122,61,0.12)] focus:outline-none transition-all caret-primary" inputmode="numeric" maxlength="1" type="text"/>
<input class="w-full h-14 bg-surface-container-lowest rounded-lg text-center font-headline-lg-mobile text-headline-lg-mobile text-on-surface shadow-[0_2px_8px_rgba(0,0,0,0.04)] focus:shadow-[0_4px_12px_rgba(27,122,61,0.12)] focus:outline-none transition-all caret-primary" inputmode="numeric" maxlength="1" type="text"/>
<input class="w-full h-14 bg-surface-container-lowest rounded-lg text-center font-headline-lg-mobile text-headline-lg-mobile text-on-surface shadow-[0_2px_8px_rgba(0,0,0,0.04)] focus:shadow-[0_4px_12px_rgba(27,122,61,0.12)] focus:outline-none transition-all caret-primary" inputmode="numeric" maxlength="1" type="text"/>
<input class="w-full h-14 bg-surface-container-lowest rounded-lg text-center font-headline-lg-mobile text-headline-lg-mobile text-on-surface shadow-[0_2px_8px_rgba(0,0,0,0.04)] focus:shadow-[0_4px_12px_rgba(27,122,61,0.12)] focus:outline-none transition-all caret-primary" inputmode="numeric" maxlength="1" type="text"/>
<input class="w-full h-14 bg-surface-container-lowest rounded-lg text-center font-headline-lg-mobile text-headline-lg-mobile text-on-surface shadow-[0_2px_8px_rgba(0,0,0,0.04)] focus:shadow-[0_4px_12px_rgba(27,122,61,0.12)] focus:outline-none transition-all caret-primary" inputmode="numeric" maxlength="1" type="text"/>
</div>

<span>Verify &amp; Login</span>

</button>

                 Didn't receive code? <button class="text-primary font-label-lg ml-1 hover:underline underline-offset-4">Resend in <span id="timer">30</span>s</button>
</p>

<div class="absolute bottom-0 left-0 w-full h-64 bg-gradient-to-t from-surface-container/50 to-transparent pointer-events-none -z-10 rounded-b-3xl"></div>
<div class="absolute top-0 right-0 w-48 h-48 bg-primary/5 rounded-full blur-3xl pointer-events-none -z-10 -translate-y-1/2 translate-x-1/4"></div>
<div class="absolute bottom-1/4 left-0 w-64 h-64 bg-secondary/5 rounded-full blur-3xl pointer-events-none -z-10 translate-y-1/4 -translate-x-1/3"></div>
</div>
<script>
    document.addEventListener('DOMContentLoaded', () => {
        const stepMobile = document.getElementById('step-mobile');
        const stepOtp = document.getElementById('step-otp');
        const btnSendOtp = document.getElementById('btn-send-otp');
        const btnEdit = document.getElementById('btn-edit');
        const mobileInput = document.getElementById('mobile-number');
        const displayNumber = document.getElementById('display-number');
        const otpInputs = document.querySelectorAll('#otp-inputs input');
        
        let timerInterval;

        
        mobileInput.addEventListener('input', function (e) {
            this.value = this.value.replace(/[^0-9]/g, '');
        });

        
        btnSendOtp.addEventListener('click', () => {
            if(mobileInput.value.length === 10) {
                displayNumber.textContent = '+91 ' + mobileInput.value.replace(/(\d{5})(\d{5})/, "$1 $2");
                
                
                stepMobile.classList.remove('opacity-100', 'translate-x-0');
                stepMobile.classList.add('opacity-0', '-translate-x-8', 'pointer-events-none');
                
                setTimeout(() => {
                    stepMobile.classList.add('hidden');
                    stepOtp.classList.remove('hidden');
                    
                    
                    setTimeout(() => {
                        stepOtp.classList.remove('opacity-0', 'translate-x-8', 'pointer-events-none');
                        stepOtp.classList.add('opacity-100', 'translate-x-0', 'relative', 'top-auto', 'left-auto', 'transform-none');
                        otpInputs[0].focus();
                        startTimer();
                    }, 50);
                }, 300);
            } else {
                
                mobileInput.parentElement.classList.add('shadow-[0_0_0_2px_rgba(186,26,26,0.5)]');
                setTimeout(() => mobileInput.parentElement.classList.remove('shadow-[0_0_0_2px_rgba(186,26,26,0.5)]'), 500);
            }
        });

        
        btnEdit.addEventListener('click', () => {
            clearInterval(timerInterval);
            
            stepOtp.classList.remove('opacity-100', 'translate-x-0', 'relative', 'top-auto', 'left-auto', 'transform-none');
            stepOtp.classList.add('opacity-0', 'translate-x-8', 'pointer-events-none', 'absolute', 'top-1/2', 'left-1/2', '-translate-x-1/2', '-translate-y-1/2');
            
            setTimeout(() => {
                stepOtp.classList.add('hidden');
                stepMobile.classList.remove('hidden');
                
                setTimeout(() => {
                    stepMobile.classList.remove('opacity-0', '-translate-x-8', 'pointer-events-none');
                    stepMobile.classList.add('opacity-100', 'translate-x-0');
                    mobileInput.focus();
                }, 50);
            }, 300);
        });

        
        otpInputs.forEach((input, index) => {
            input.addEventListener('input', function(e) {
                this.value = this.value.replace(/[^0-9]/g, '');
                if (this.value !== '') {
                    
                    if (index < otpInputs.length - 1) {
                        otpInputs[index + 1].focus();
                    }
                }
            });

            input.addEventListener('keydown', function(e) {
                if (e.key === 'Backspace' && this.value === '') {
                    if (index > 0) {
                        otpInputs[index - 1].focus();
                        otpInputs[index - 1].value = '';
                    }
                }
            });
            
            input.addEventListener('paste', function(e) {
                e.preventDefault();
                const pastedData = e.clipboardData.getData('text').replace(/[^0-9]/g, '').slice(0, 6);
                for(let i = 0; i < pastedData.length; i++) {
                    if(otpInputs[i]) {
                        otpInputs[i].value = pastedData[i];
                        if(i < 5) otpInputs[i+1].focus();
                    }
                }
            });
        });

        function startTimer() {
            let timeLeft = 30;
            const timerDisplay = document.getElementById('timer');
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                timeLeft--;
                timerDisplay.textContent = timeLeft;
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    timerDisplay.parentElement.innerHTML = 'Didn\'t receive code? <button class="text-primary font-label-lg ml-1 hover:underline underline-offset-4" onclick="startTimer()">Resend Now</button>';
                }
            }, 1000);
        }
    });
</script></main><nav class="fixed bottom-0 w-full z-50 pb-safe bg-surface/90 backdrop-blur-xl shadow-[0_-1px_8px_rgba(0,0,0,0.04)]" data-active-classes="text-primary"><div class="flex justify-around items-center h-20"><a aria-current="page" class="flex flex-col items-center justify-center gap-1 w-1/4 h-full transition-colors text-primary" data-path="home" href="#"><span class="material-symbols-outlined text-[24px]">home</span><span class="font-label-sm text-label-sm">Home</span></a><a class="flex flex-col items-center justify-center gap-1 w-1/4 h-full text-on-surface-variant transition-colors" data-path="farms" href="#"><span class="material-symbols-outlined text-[24px]">potted_plant</span><span class="font-label-sm text-label-sm">Farms</span></a><a class="flex flex-col items-center justify-center gap-1 w-1/4 h-full text-on-surface-variant transition-colors" data-path="insurance" href="#"><span class="material-symbols-outlined text-[24px]">shield_with_heart</span><span class="font-label-sm text-label-sm">Insurance</span></a><a class="flex flex-col items-center justify-center gap-1 w-1/4 h-full text-on-surface-variant transition-colors" data-path="alerts" href="#"><span class="material-symbols-outlined text-[24px]">notifications</span><span class="font-label-sm text-label-sm">Alerts</span></a></div></nav></body></html>
